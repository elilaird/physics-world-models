
name: pendulum_conservative
version: 2026-05-20_16-10-00
n_seqs: 50000
seq_len: 50
dt: 0.25
val_split: 0.1
test_split: 0.1
chunk_size: 100
env:
  name: pendulum
  state_dim: 2
  action_dim: 3
  params:
    m: 0.5
    L: 1.0
    g: 9.81
    c: 0.1 # slightly damped
  variable_params: {} # no variability for now; just want to test on a single deterministic system
  init_sampling: energy_radius
  # r = sqrt(2E). r_max=4.0 => E=8.0, well below separatrix 2mgL=19.62
  # (pendulum swings but never goes over the top). r_min=1.5 => E=1.125,
  # enough for ~28 deg maximal swing so no near-stationary trajectories.
  energy_radius_range: [1.5, 4.0]
  init_state_range:
    - [-3.14, 3.14]
    - [-2.0, 2.0]
  img_size: 64
  channels: 3
  color: true
  render_quality: medium
  ball_color: null
  bg_color: null
  ball_radius: null
