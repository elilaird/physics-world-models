defaults:
  - env: oscillator_visual
  - dataset: oscillator_visual_testing
  - model: visual_world_model
  - predictor: latent_hamiltonian
  - _self_

seed: 42

# Path to a pretrained checkpoint to load weights from (null = train from scratch)
pretrained_checkpoint: null

training:
  epochs: 100
  batch_size: 32
  lr: 5e-4
  lr_min: 5e-5
  # Which visual model components to train (false = frozen).
  train_encoder: true
  train_decoder: true
  train_predictor: true
  # --- JEPA / LeWorldModel settings ---
  # SIGReg regularization weight (THE key LeWM hyperparameter; 0.01–1.0)
  sigreg_lambda: 0.1
  # Number of random projections for SIGReg (paper shows insensitive)
  sigreg_projections: 1024
  # Quadrature knots for Epps-Pulley normality test (paper shows insensitive)
  sigreg_knots: 50
  # Reconstruction loss weight on predicted states (0 = pure JEPA; >0 = hybrid)
  hybrid_recon_weight: 0.1
  # Detach prediction targets in JEPA mode (prevents encoder overfitting to predictor)
  detach_jepa_targets: false
  # --- Stability / regularization knobs (default OFF — sweep to study effects) ---
  # Energy-variance regularizer: -λ·log(var(H(z))). Pushes H_net to differentiate
  # states in z-space, countering the "flat H" failure (energy_time_var ~ 1e-7).
  energy_var_lambda: 0.0
  # Gaussian noise on encoder outputs (training only). Symmetric on inputs and
  # JEPA targets — the encoder learns a noise-robust representation.
  encoder_noise_std: 0.0
  # Gaussian noise on predicted latents between unroll steps (training only).
  # Trains a contractive flow that damps small errors instead of amplifying them.
  predictor_noise_std: 0.001 # new best

ckpt_base_path: '/lustre/smuexa01/client/users/ejlaird/physics-world-models'
data_root: ${ckpt_base_path}/datasets

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}/${model.name}
  sweep:
    dir: ${ckpt_base_path}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${model.name}

wandb:
  enabled: true
  project: physics-world-models
  log_images_every: 1
  n_log_images: 1

checkpoint_dir: ${ckpt_base_path}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}/${model.name}

# evaluate.py settings
checkpoint: null

eval:
  horizon: 50
  dt_values: [0.05,0.1,0.2,0.4,0.5]
  n_rollouts: 8
  dt_seq_len: null
  substeps: 1
  dt_gen_every_n_epochs: 5
  save_curves: true
  curves_filename: eval_curves.pt
  eval_dataset_dir: null
  eval_dataset_seed: 0
